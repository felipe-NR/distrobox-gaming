---
# melonDS standalone: seed config + local BIOS/firmware copies.
# Seed-only-if-missing everywhere: the toml accumulates user state
# (window geometry, joystick mapping) and melonDS mutates the
# firmware file with user settings.

- name: Ensure melonDS directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ dg_melonds_config_dir }}"
    - "{{ dg_melonds_config_dir }}/bios"

- name: Look for the DS BIOS/firmware in the BIOS root
  ansible.builtin.stat:
    path: "{{ dg_bios_root }}/{{ item }}"
  loop: "{{ dg_melonds_bios_files }}"
  register: _melonds_bios

- name: Copy DS BIOS/firmware from the BIOS root (seed only if missing)
  ansible.builtin.copy:
    src: "{{ item.stat.path }}"
    dest: "{{ dg_melonds_config_dir }}/bios/{{ item.item }}"
    remote_src: true
    force: false
    mode: "0644"
  loop: "{{ _melonds_bios.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists

- name: Warn about missing DS BIOS/firmware
  # User-supplied dumps. melonDS still runs DS games on its built-in
  # FreeBIOS; DSi mode and the firmware menu need the real files.
  ansible.builtin.debug:
    msg: "WARNING: {{ dg_bios_root }}/{{ item.item }} missing; melonDS is seeded with FreeBIOS (ExternalBIOSEnable=false)."
  loop: "{{ _melonds_bios.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not item.stat.exists

- name: Seed melonDS config (seed only if missing)
  ansible.builtin.template:
    src: melonDS.toml.j2
    dest: "{{ dg_melonds_config_dir }}/melonDS.toml"
    force: false
    mode: "0644"
